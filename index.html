<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Escape - The Lost Labyrinth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <header>
            <h1>🗝️ Maze Escape</h1>
            <p class="subtitle">The Lost Labyrinth</p>
        </header>

        <div class="game-info">
            <div class="info-box">
                <span>⏱️ Time</span>
                <span id="timer">60</span>
            </div>

            <div class="info-box">
                <span>⭐ Score</span>
                <span id="score">0</span>
            </div>

            <div class="info-box">
                <span>🗝️ Keys</span>
                <span id="keys">0</span>
            </div>
        </div>

        <div id="message">Collect the keys and find the exit!</div>

        <div class="maze-wrapper">
            <canvas id="mazeCanvas"></canvas>
        </div>

        <div class="controls">
            <p>🎮 Use Arrow Keys or WASD to move</p>
        </div>

        <div class="buttons">
            <button id="startBtn">▶ Start Game</button>
            <button id="restartBtn">↻ Restart</button>
        </div>

        <footer>
            <p>Find the keys. Unlock the exit. Escape!</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
